<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LedgerHawk Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Source for cover.png: render at exactly 1280x720. Dark tokens from index.html; colour only carries meaning (red = stop). */
:root { --desk: #0E0E10; --panel: #161618; --ink: #EDEDEC; --ink-2: #A1A1AA; --ink-3: #8B8B94; --rule-2: rgb(237 237 236 / .16); --red: #F26D80;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --cond: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--desk); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { position: relative; width: 1280px; height: 720px; }
.text { position: absolute; left: 76px; top: 120px; width: 580px; }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; font: 600 20px var(--cond); color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; }
h1 { font: 700 78px/1 var(--cond); letter-spacing: -.015em; margin: 0 0 26px 0; display: flex; align-items: center; gap: 14px; margin-left: -12px; }
h1 svg { flex: none; }
p { font-size: 30px; line-height: 1.3; margin: 0; color: var(--ink-2); }
p em { font-style: normal; color: var(--red); font-weight: 500; }
.tags { position: absolute; left: 76px; bottom: 76px; display: flex; gap: 12px; }
.tag { font: 600 16px var(--cond); letter-spacing: .06em; text-transform: uppercase; padding: 7px 12px; border: 1px solid var(--rule-2); border-radius: 999px; color: var(--ink-2); }
.sheet { position: absolute; left: 640px; top: 96px; width: 640px; transform: rotate(-2.5deg); transform-origin: left top;
  box-shadow: 0 0 0 1px rgb(0 0 0 / .5), 0 30px 60px -24px rgb(0 0 0 / .8); }
.sheet img { display: block; width: 100%; }
</style>
</head>
<body>

  </div>
  <div class="sheet"><img src="crop-fraud-dark.png" alt=""></div>
  <div class="tags"><span class="tag">Evolus Business Agents</span><span class="tag">Qwen2.5-7B on AMD Instinct MI300X · vLLM</span></div>
</div>
